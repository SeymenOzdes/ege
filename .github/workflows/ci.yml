name: Verify

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # pnpm sürümü package.json'daki `packageManager` alanından okunur.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          # package.json'daki `supabase` sürümüyle aynı olmalı; eski CLI config.toml'u okuyamıyor.
          version: 2.114.0
      - run: supabase start
      - run: supabase db reset --local
      - run: supabase db lint --level error
      - run: supabase test db

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          # package.json'daki `supabase` sürümüyle aynı olmalı; eski CLI config.toml'u okuyamıyor.
          version: 2.114.0

      # Testler seed.sql'deki örnek haberlere ve yerel admin hesabına dayanıyor;
      # `supabase start` göçleri ve seed'i uygular. Testlerin kullanmadığı
      # servisler açılış süresini kısaltmak için atlanıyor.
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta
      - name: Write .env.local from the local Supabase stack
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000"
            echo "NEXT_PUBLIC_SITE_NAME=Ege'nin Nabzı"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
          } > .env.local

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
